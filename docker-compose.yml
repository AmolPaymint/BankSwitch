version: "3.9"

# ============================================================
# BankSwitch v25 — Local Development Stack
# ============================================================
# Usage:
#   docker compose up          # Start all services
#   docker compose up engine   # Start only the Engine + deps
#   docker compose logs -f engine
#   docker compose down -v     # Tear down including volumes
#
# Secrets for local dev are in docker-compose.override.yml
# (not checked in). Copy docker-compose.override.example.yml.
# ============================================================

services:

  # ── SQL Server 2022 ──────────────────────────────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: bankswitch-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQL_SA_PASSWORD:-Dev_P@ssw0rd_2024!}"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./db:/db:ro                      # mount migration scripts
    healthcheck:
      test: /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "${SQL_SA_PASSWORD:-Dev_P@ssw0rd_2024!}" -Q "SELECT 1" -b
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [bankswitch]

  # ── Database migrations (runs once then exits) ────────────
  db-migrate:
    image: mcr.microsoft.com/mssql-tools:latest
    container_name: bankswitch-migrate
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./db:/db:ro
      - ./scripts/run-migrations.sh:/run-migrations.sh:ro
    entrypoint: ["/bin/bash", "/run-migrations.sh"]
    environment:
      SQL_SERVER: sqlserver
      SQL_SA_PASSWORD: "${SQL_SA_PASSWORD:-Dev_P@ssw0rd_2024!}"
      SQL_DATABASE: SwitchDB
    networks: [bankswitch]

  # ── Redis (distributed cache + replay cache) ─────────────
  redis:
    image: redis:7-alpine
    container_name: bankswitch-redis
    command: redis-server --requirepass "${REDIS_PASSWORD:-DevRedis2024!}" --save 900 1 --loglevel notice
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: redis-cli -a "${REDIS_PASSWORD:-DevRedis2024!}" ping
      interval: 5s
      timeout: 3s
      retries: 5
    networks: [bankswitch]

  # ── BankSwitch Engine (ISO 8583 TCP gateway) ─────────────
  engine:
    build:
      context: .
      dockerfile: Dockerfile.Engine
    image: bankswitch/engine:${IMAGE_TAG:-local}
    container_name: bankswitch-engine
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"   # ISO 8583 TCP gateway
      - "5000:5000"   # Internal HTTP (health, metrics)
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__SwitchDb: "Server=sqlserver,1433;Database=SwitchDB;User ID=switch_app;Password=${APP_DB_PASSWORD:-Dev_P@ssw0rd_2024!};Encrypt=False;TrustServerCertificate=True"
      Redis__ConnectionString: "redis:6379,password=${REDIS_PASSWORD:-DevRedis2024!},abortConnect=False"
      Hsm__Mode: HmacSoftwareForTestOnly
      StandIn__Enabled: "false"
      DOTNET_RUNNING_IN_CONTAINER: "true"
    volumes:
      - engine_clearing:/app/clearing-files
      - engine_logs:/app/logs
    healthcheck:
      test: curl -f http://localhost:5000/health/live || exit 1
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [bankswitch]
    restart: unless-stopped

  # ── BankSwitch Admin (Razor Pages + REST API) ────────────
  admin:
    build:
      context: .
      dockerfile: Dockerfile.Admin
    image: bankswitch/admin:${IMAGE_TAG:-local}
    container_name: bankswitch-admin
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8081
      ConnectionStrings__SwitchDb: "Server=sqlserver,1433;Database=SwitchDB;User ID=switch_app;Password=${APP_DB_PASSWORD:-Dev_P@ssw0rd_2024!};Encrypt=False;TrustServerCertificate=True"
      Redis__ConnectionString: "redis:6379,password=${REDIS_PASSWORD:-DevRedis2024!},abortConnect=False"
      Admin__BootstrapUser: admin
      Admin__BootstrapPassword: "${ADMIN_PASSWORD:-Admin_Dev_2024!@#}"
      Totp__AllowDevelopmentCode: "true"
      DOTNET_RUNNING_IN_CONTAINER: "true"
    volumes:
      - admin_logs:/app/logs
    healthcheck:
      test: curl -f http://localhost:8081/health/live || exit 1
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [bankswitch]
    restart: unless-stopped

  # ── Prometheus ────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: bankswitch-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    networks: [bankswitch]

  # ── Grafana ───────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    container_name: bankswitch-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:-GrafanaAdmin2024!}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/bankswitch.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks: [bankswitch]
    depends_on: [prometheus]

volumes:
  sqlserver_data:
  redis_data:
  prometheus_data:
  grafana_data:
  engine_clearing:
  engine_logs:
  admin_logs:

networks:
  bankswitch:
    driver: bridge
    name: bankswitch-network
