global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    cluster: bankswitch-prod
    region:  westeurope

# ── Alerting Rules ───────────────────────────────────────────
rule_files:
  - /etc/prometheus/rules/*.yml

# ── Alertmanager ─────────────────────────────────────────────
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

# ── Scrape Configs ────────────────────────────────────────────
scrape_configs:

  # Prometheus itself
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  # BankSwitch Engine — direct scrape (local dev / docker-compose)
  - job_name: bankswitch-engine
    scrape_interval: 10s
    metrics_path: /metrics
    static_configs:
      - targets:
          - engine:5000
        labels:
          service:    bankswitch-engine
          component:  iso8583-gateway

  # BankSwitch Admin — direct scrape (local dev / docker-compose)
  - job_name: bankswitch-admin
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets:
          - admin:8081
        labels:
          service:    bankswitch-admin
          component:  admin-portal

  # Kubernetes pod autodiscovery (production — requires RBAC)
  - job_name: kubernetes-pods-bankswitch
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [bankswitch]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
        target_label: component
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_instance]
        target_label: release
      - source_labels: [__meta_kubernetes_namespace]
        target_label: kubernetes_namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: kubernetes_pod_name
